[package]
name = "newsletter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib.rs"

[[bin]]
path="src/main.rs"
name="newsletter"


[dependencies]
config = "0.13"
actix-web = "4.5.1"
serde = {version = "1", features = ["derive"] }
tokio = {version = "1", features = ["macros", "rt-multi-thread"]}
uuid = {version = "1", features = ["v4"]}
chrono = {version = "0.4.22", default-features = false, features = ["clock"]}

[dependencies.sqlx]
version = "0.6"
default-features = false
features = [
    "runtime-tokio-rustls", # thell to SQLX to use tokio like runtime with TLS backend
    "macros", # this feature give us acess to sqlx::query! and SQLX::query_as!
    "postgres", # unlock postgres use
    "uuid", # unlock support to UUID in Postgres
    "chrono", # add support to SQL timestamptz
    "migrate" # give us access to the same functions used under the hood by sqlx-cli
]

[dev-dependencies]
reqwest = "0.12.4"
